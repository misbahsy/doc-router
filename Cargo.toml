[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Default features are already text-only: no `ocr`, `vision` or `render-pdfium`.
pdf-inspector = "1.17"
lopdf = { version = "0.44", features = ["rayon"] }
# Tooling and the hosted-judge crates, never the core library.
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
ureq = { version = "3", features = ["json"] }
