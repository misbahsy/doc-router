[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "doc-router"
description = "Per-page routing between local PDF text extraction and paid OCR models"
license = { text = "MIT" }
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Text Processing :: Markup",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
# The compiled cdylib is `doc_router._native`; `python/doc_router/__init__.py`
# re-exports it so callers only ever import `doc_router`.
module-name = "doc_router._native"
python-source = "python"
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
